# fly.toml app configuration file generated for google-workspace-mcp-proud-mountain-9102 on 2025-12-22T17:01:45-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'google-workspace-mcp-proud-mountain-9102'
primary_region = 'iad'

[build]

[env]
  MCP_ENABLE_OAUTH21 = 'true'
  MCP_SINGLE_USER_MODE = 'false'
  OAUTHLIB_INSECURE_TRANSPORT = '0'
  WORKSPACE_MCP_STATELESS_MODE = 'true'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
